# ─────────────────────────────────────────────────────────────
# fold-cyberdeck 설정 예시
# 이 파일을 android/local.properties 에 복사해 값을 채운다.
# (local.properties 는 .gitignore 에 있어 커밋되지 않는다)
# ─────────────────────────────────────────────────────────────

# Android SDK 위치 (Android Studio 가 보통 자동으로 채운다)
sdk.dir=/path/to/Android/sdk

# 폰 앱이 접속할 맥(deckd) 목록.  이름@호스트:포트  를 쉼표로 잇는다. 포트 생략 시 8790.
# 호스트는 Tailscale 주소나 MagicDNS 이름을 권한다(deckd 는 Tailscale 주소에만 바인딩한다).
# 첫 번째가 기본값이고, 앱의 서버 태그를 누르면 다음 맥으로 넘어간다.
deck.servers=노트북@my-laptop.example:8790,집 맥@my-desktop.example:8790

# 같은 값을 환경변수 DECK_SERVERS 나 gradle 속성 -Pdeck.servers=... 로 줘도 된다.
# 토큰은 여기 넣지 않는다 — 맥에서 `mac/run.sh token` 으로 확인해 앱의 「토큰 설정」에 입력한다.
