<style>
html,body{width:900px;height:666px;overflow:hidden;position:relative}

.desk{position:absolute;left:0;top:0;width:1600px;height:1000px;overflow:hidden;font-family:"Pretendard",sans-serif;color:#1d1d1f;
  background:linear-gradient(150deg,#A9C2B2 0%,#7A98AE 55%,#566F8A 100%);transform-origin:0 0}
.desk .bar{height:32px;background:rgba(246,246,248,.86);display:flex;align-items:center;gap:22px;padding:0 18px;font-size:16px}
.desk .bar b{font-weight:700}
.desk .bar .r{margin-left:auto;display:flex;gap:22px;align-items:center}
.desk .win{position:absolute;background:#fff;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.28);overflow:hidden}
.desk .tb{height:44px;background:#ECECEE;border-bottom:1px solid #DADADC;display:flex;align-items:center;gap:9px;padding:0 16px;font-size:17px;color:#444;position:relative}
.desk .tb i{width:14px;height:14px;border-radius:50%;display:block}
.desk .tb i:nth-child(1){background:#FF5F57}.desk .tb i:nth-child(2){background:#FEBC2E}.desk .tb i:nth-child(3){background:#28C840}
.desk .tb span{position:absolute;left:0;right:0;text-align:center;font-weight:600;pointer-events:none}
.desk .win.back .tb i{background:#CFCFD2}
.desk .doc{padding:30px 38px;white-space:pre-line}
.desk .cur{display:inline-block;width:3px;background:#1d1d1f;vertical-align:-6px}
.desk .dock{position:absolute;left:50%;bottom:12px;transform:translateX(-50%);height:78px;padding:10px 14px;border-radius:22px;background:rgba(255,255,255,.35);display:flex;gap:12px}
.desk .dock span{width:58px;height:58px;border-radius:14px;display:block}
.desk .mouse{position:absolute;width:0;height:0;border-left:12px solid transparent;border-right:12px solid transparent;border-bottom:30px solid #111;transform:rotate(-28deg);filter:drop-shadow(0 0 2px #fff)}
.desk table{border-collapse:collapse;width:100%;font-size:20px}
.desk th,.desk td{border:1px solid #E2E2E5;padding:9px 12px;text-align:left;white-space:nowrap}
.desk th{background:#F4F4F6;font-weight:600;color:#555}
.desk td.n{text-align:right;font-variant-numeric:tabular-nums}
.desk tr.sum td{font-weight:700;background:#F7FAEF}

body{background:#000}
.ph{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text)}
.deck{--key:color-mix(in srgb,var(--text) 14%,var(--bg));--key-acc:color-mix(in srgb,var(--accent) 26%,var(--bg))}
.ph .status-bar{height:30px;padding:0 18px;font-size:14px}
.stream{position:relative;flex:none;background:#000;overflow:hidden}
.stream .fit{position:absolute;left:0;top:0}
.band{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);border-radius:5px;padding:3px 12px;color:var(--bg);font-family:var(--mono);font-weight:800;white-space:nowrap;z-index:5}
.badge{position:absolute;right:8px;top:8px;border-radius:6px;padding:2px 9px;background:var(--accent);color:var(--bg);font-weight:800;z-index:5}
.tele{flex:none;display:flex;align-items:center;gap:12px;padding:0 12px;font-family:var(--mono);color:var(--dim);background:var(--panel);border-top:1px solid var(--border);white-space:nowrap;overflow:hidden}
.tele .srv{color:var(--accent);font-weight:700}
.dchips{flex:none;display:flex;gap:7px;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--border);overflow:hidden}
.dchip{flex:none;padding:0 10px;border-radius:7px;display:inline-flex;align-items:center;font-family:var(--mono);border:1px solid var(--border);color:var(--text);background:var(--panel2)}
.dchip.on{border-color:var(--accent);color:var(--accent);background:var(--accent-tint);font-weight:700}
.kb{flex:none;display:flex;flex-direction:column;gap:4px;padding:6px 5px 4px}
.kr{display:flex;gap:3px}
.k{flex:1 1 0;min-width:0;border-radius:6px;background:var(--key);color:var(--text);display:flex;align-items:center;justify-content:center;font-family:var(--mono);white-space:nowrap}
.k.a{background:var(--key-acc);color:var(--accent);font-weight:700}
.k.hit{background:var(--accent);color:var(--bg);font-weight:800}
.pad{flex:1;min-height:0;display:flex;gap:7px;padding:6px 8px 10px}
.tp{flex:1;border-radius:14px;background:var(--panel2);border:1px solid var(--border);position:relative;display:flex;align-items:center;justify-content:center;color:var(--dim)}
.lr{display:flex;flex-direction:column;gap:7px}
.lr span{flex:1;border-radius:11px;background:var(--key);display:flex;align-items:center;justify-content:center;font-family:var(--mono);color:var(--text)}
.mic{border-radius:12px;background:var(--panel2);border:1px solid var(--border);color:var(--dim);display:flex;flex-direction:column;gap:6px;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700}
.mic.on{background:var(--accent);color:var(--bg);border-color:var(--accent)}
.touch{position:absolute;border-radius:50%;background:color-mix(in srgb,var(--accent) 32%,transparent);border:3px solid var(--accent);z-index:6}

</style>
</head><body>
